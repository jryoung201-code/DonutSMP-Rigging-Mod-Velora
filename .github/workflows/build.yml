name: Build Velora

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

# If several commits arrive close together, cancel the older run and keep only
# the newest run for that branch or tag.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
      tag_created: ${{ steps.autotag.outputs.created }}
      jar_path: ${{ steps.package.outputs.jar_path }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n1 | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "Could not read mod_version from gradle.properties"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "jar_name=velora-$version.jar" >> "$GITHUB_OUTPUT"
          echo "Building Velora version $version"
      - name: Build mod
        run: ./gradlew clean build --no-daemon
      - name: Package current version JAR only
        id: package
        shell: bash
        env:
          EXPECTED_JAR: ${{ steps.version.outputs.jar_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          source_jar="build/libs/$EXPECTED_JAR"
          if [ ! -f "$source_jar" ]; then
            echo "Expected current version JAR not found: $source_jar"
            echo "Available JARs:"
            find build/libs -maxdepth 1 -type f -name '*.jar' -print
            exit 1
          fi
          # Start clean and copy exactly one file. Never attach old version JARs.
          rm -f release/*.jar
          cp "$source_jar" "release/$EXPECTED_JAR"
          echo "jar_path=release/$EXPECTED_JAR" >> "$GITHUB_OUTPUT"
          find release -maxdepth 1 -type f -name '*.jar' -printf '%f\n'
          test "$(find release -maxdepth 1 -type f -name '*.jar' | wc -l)" -eq 1
      - name: Automatically create version tag for main
        id: autotag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists; not overwriting it."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION_TAG" -m "Velora $VERSION_TAG"
          git push origin "$VERSION_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Upload current version JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-mod-${{ steps.version.outputs.tag }}
          path: ${{ steps.package.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with current version JAR only
        if: (github.ref == 'refs/heads/main' && steps.autotag.outputs.created == 'true') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Velora ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-pre') }}
          files: ${{ steps.package.outputs.jar_path }}
