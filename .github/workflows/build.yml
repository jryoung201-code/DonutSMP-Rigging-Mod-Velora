name: Build and Release Mod Only

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: gradle clean build --no-daemon

      - name: Prepare mod JAR only
        shell: bash
        run: |
          mkdir -p release
          find build/libs -maxdepth 1 -type f -name 'velora-*.jar' ! -name '*-sources.jar' -exec cp {} release/ \;
          if [ -z "$(find release -maxdepth 1 -type f -name '*.jar' -print -quit)" ]; then
            echo "No mod JAR found in build/libs."
            exit 1
          fi
          ls -lh release/

      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-mod-${{ github.ref_name }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with mod JAR only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.jar
