name: Build Velora

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew clean build --no-daemon
      - name: Prepare mod JAR only
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          mod_jars=()
          for jar in build/libs/velora-*.jar; do
            if [[ "$jar" != *"-sources.jar" ]]; then
              mod_jars+=("$jar")
            fi
          done

          if [ "${#mod_jars[@]}" -eq 0 ]; then
            echo "No mod JAR found in build/libs."
            exit 1
          fi

          for jar in "${mod_jars[@]}"; do
            cp "$jar" release/
          done

          ls -lh release/
      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-mod-${{ github.ref_name }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with mod JAR only
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Velora ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*.jar
