name: Build Velora

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.tag }}
      tag_created: ${{ steps.autotag.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        id: version
        shell: bash
        run: |
          version="$(sed -n 's/^mod_version=//p' gradle.properties | head -n1 | tr -d '\r')"
          if [ -z "$version" ]; then
            echo "Could not read mod_version from gradle.properties"
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "Building Velora version $version"
      - name: Build mod
        run: ./gradlew clean build --no-daemon
      - name: Move current mod JAR into release
        shell: bash
        run: |
          mkdir -p release
          shopt -s nullglob
          mod_jars=()
          for jar in build/libs/velora-*.jar; do
            if [[ "$jar" != *"-sources.jar" ]]; then
              mod_jars+=("$jar")
            fi
          done
          if [ "${#mod_jars[@]}" -eq 0 ]; then
            echo "No mod JAR found in build/libs."
            exit 1
          fi
          cp "${mod_jars[0]}" release/
          ls -lh release/
      - name: Automatically create version tag for main
        id: autotag
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION_TAG" >/dev/null 2>&1; then
            echo "Tag $VERSION_TAG already exists; not overwriting it."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION_TAG" -m "Velora $VERSION_TAG"
          git push origin "$VERSION_TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"
      - name: Upload mod JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: velora-mod-${{ steps.version.outputs.tag }}
          path: release/*.jar
          if-no-files-found: error
          retention-days: 30
      - name: Create GitHub Release with mod JAR
        if: (github.ref == 'refs/heads/main' && steps.autotag.outputs.created == 'true') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Velora ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.version.outputs.tag, '-pre') }}
          files: release/*.jar
